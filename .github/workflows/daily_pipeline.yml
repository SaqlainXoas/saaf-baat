name: Publish morning brief
on:
  workflow_dispatch: {}
  schedule:
    # 05:37 and 07:37 PKT. The second run resumes persisted drafts when needed.
    # GitHub schedules are best-effort, not an exact publication-time guarantee.
    - cron: '37 0 * * *'
    - cron: '37 2 * * *'
permissions:
  contents: read
concurrency:
  group: morning-brief-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_PIPELINE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      SAAF_DB_BACKEND: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional. Set both to swap the cached edition on Vercel the moment
      # this run publishes; without them the page refreshes on its own window.
      SAAF_REVALIDATE_URL: ${{ secrets.SAAF_REVALIDATE_URL }}
      SAAF_REVALIDATE_SECRET: ${{ secrets.SAAF_REVALIDATE_SECRET }}
      # Polled until it answers before the revalidation above is sent. Render
      # Free sleeps after ~15 minutes idle and this pipeline is not one of its
      # callers, so revalidating first re-rendered the page against a sleeping
      # API, blew the frontend's fetch timeout and cached "Unable to load
      # brief". Not a secret - it is the public API origin.
      SAAF_BACKEND_HEALTH_URL: https://saaf-baat-api.onrender.com/health
      SAAF_STAGE_PUBLICATION: '1'
      SAAF_PUBLICATION_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
      SAAF_LOW_COST_MODE: '1'
      # These three are read as written. Low-cost mode lowers a default it was
      # not given; it does not overrule an explicit value. Until 2026-09-13 it
      # did, silently: this file asked for 40 articles per source and the run
      # ingested 25, which is why three consecutive briefs shipped short.
      SAAF_MAX_ARTICLES_PER_SOURCE: '40'
      SAAF_EMBEDDING_BACKFILL_LIMIT: '50'
      # The shortlist the editor picks from, and the only depth a short-pass
      # retry has to reach into. At the low-cost ceiling of 24 the 2026-09-13
      # run logged "attempt 2 returned 5 stories ... (saw 24/24 candidates)":
      # it had read every candidate it would ever be offered and still had no
      # sixth groundable story. Costs shortlist size in 1-3 Gemini calls.
      SAAF_EDITORIAL_CANDIDATE_LIMIT: '30'
      SAAF_PIPELINE_HEARTBEAT_FILE: backend/.pipeline_heartbeat.json
      SAAF_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        run: |
          python - <<'PY'
          import os
          required = ('SUPABASE_URL', 'SUPABASE_KEY', 'GEMINI_API_KEY')
          missing = [key for key in required if not os.getenv(key)]
          if missing:
              raise SystemExit('Add GitHub Actions secrets: ' + ', '.join(missing))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-pipeline.lock
      - name: Install pipeline
        run: |
          python -m pip install -r requirements-pipeline.lock
          python -m spacy download en_core_web_sm
      - name: Generate, recover and publish the edition
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode=manual
          elif [ "$SAAF_SCHEDULE" = '37 2 * * *' ]; then
            mode=backup
          else
            mode=primary
          fi
          python scripts/daily_run.py --mode "$mode"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-health-${{ github.run_id }}
          path: backend/.pipeline_heartbeat.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
