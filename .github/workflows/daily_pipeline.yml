name: Pipeline refresh

on:
  schedule:
    # Every hour at minute 0 (UTC)
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SAAF_ENABLE_PLAYWRIGHT_FALLBACK: "0"
      SAAF_LOW_COST_MODE: "1"
      SAAF_MAX_ARTICLES_PER_SOURCE: "20"
      SAAF_EMBEDDING_BACKFILL_LIMIT: "50"
      SAAF_PIPELINE_HEARTBEAT_FILE: "backend/.pipeline_heartbeat.json"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run pipeline
        run: |
          cd backend
          python run_pipeline.py --disable-playwright --low-cost-mode --log-level INFO
