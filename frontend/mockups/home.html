<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saaf Baat — Morning Brief</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./ui.css" />
  </head>
  <body>
    <div class="stage">
      <div class="phone">
        <header class="header">
          <h1 class="greet">Good Morning,<br />Islamabad.</h1>
          <div class="sub" aria-label="Context">
            <span>☀︎ 24°C</span>
            <span class="dot" aria-hidden="true"></span>
            <span>Thu, Feb 5</span>
            <span class="dot" aria-hidden="true"></span>
            <span>Your 5 essential stories</span>
          </div>
        </header>

        <section class="deck" id="deck" aria-label="Story deck"></section>

        <div class="caught">
          You’re all caught up.<br />
          Enjoy your day.
        </div>
      </div>
    </div>

    <script src="./mock-data.js"></script>
    <script>
      const deck = document.getElementById("deck");

      const impactLabel = (labels) => (labels && labels.length ? labels[0] : "Update");
      const pillText = (lbl) => {
        if (!lbl) return "UPDATE";
        if (lbl.includes("WALLET")) return "WALLET";
        if (lbl.includes("SAFETY")) return "SAFETY";
        if (lbl.includes("COMMUTE")) return "COMMUTE";
        if (lbl.includes("WORK")) return "WORK";
        if (lbl.includes("UTILITIES")) return "UTILITIES";
        if (lbl.includes("GOVERNANCE")) return "GOVERNANCE";
        return "UPDATE";
      };

      const deckCard = (item, depth) => {
        const sources = (item.sources || []).slice(0, 3);
        const srcPills = sources.map((s) => `<span class="src">${s.source}</span>`).join("");
        const label = pillText(impactLabel(item.impact_labels));

        return `
          <article class="story" data-depth="${depth}">
            <div class="pill"><span class="mini" aria-hidden="true"></span>${label}</div>
            <h2 class="title">${item.headline}</h2>
            <p class="snippet">${item.snippet}</p>
            <div class="meta">
              <span class="badge"><span class="b-dot"></span>${item.category}</span>
              ${(item.impact_labels || []).slice(0, 2).map((x) => `<span class="badge">${x}</span>`).join("")}
            </div>
            <div class="sources">
              <div class="srcs" aria-label="Sources">${srcPills}</div>
              <a class="open" href="./story.html">Open</a>
            </div>
          </article>
        `;
      };

      const top = FEED.slice(0, 4);
      const layers = top.map((item, i) => deckCard(item, Math.min(i, 3))).reverse().join("");
      deck.innerHTML = layers;
    </script>
  </body>
</html>
