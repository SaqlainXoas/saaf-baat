<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saaf Baat — Story</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./ui.css" />
  </head>
  <body>
    <div class="stage">
      <div class="phone">
        <header class="header">
          <a class="sub" href="./home.html" aria-label="Back to home">
            <span>← Back</span>
            <span class="dot" aria-hidden="true"></span>
            <span>Today</span>
          </a>
        </header>

        <section class="story" data-depth="0" id="story"></section>

        <section class="section" aria-label="Consensus engine">
          <h4>Consensus Engine</h4>
          <div class="block agree" id="agree"></div>
          <div class="block debate" id="debate"></div>
          <div class="foot" id="foot"></div>
        </section>

        <section class="section" aria-label="Original sources">
          <h4>Original sources</h4>
          <div class="orig" id="orig"></div>
        </section>
      </div>
    </div>

    <script src="./mock-data.js"></script>
    <script>
      const story = STORY_DETAIL;

      const pillText = (lbl) => {
        if (!lbl) return "UPDATE";
        if (lbl.includes("WALLET")) return "WALLET";
        if (lbl.includes("SAFETY")) return "SAFETY";
        if (lbl.includes("COMMUTE")) return "COMMUTE";
        if (lbl.includes("WORK")) return "WORK";
        if (lbl.includes("UTILITIES")) return "UTILITIES";
        if (lbl.includes("GOVERNANCE")) return "GOVERNANCE";
        return "UPDATE";
      };

      const storyEl = document.getElementById("story");
      const label = pillText((story.impact_labels || [])[0]);
      storyEl.innerHTML = `
        <div class="pill"><span class="mini" aria-hidden="true"></span>${label}</div>
        <h2 class="title">${story.headline}</h2>
        <p class="snippet" style="-webkit-line-clamp:6">${story.snippet}</p>
      `;

      const agreeEl = document.getElementById("agree");
      const agree = (story.confirmed_facts || []).slice(0, 3);
      agreeEl.innerHTML = `
        <div class="block-title"><span class="icon">✅</span>What’s agreed</div>
        <div class="items">
          ${agree.map((e) => `<div class="item"><div class="mark">✓</div><div><strong>${e.text}</strong></div></div>`).join("")}
        </div>
      `;

      const debateEl = document.getElementById("debate");
      const debate = (story.debated_claims || []).slice(0, 2);
      debateEl.innerHTML = `
        <div class="block-title"><span class="icon">❓</span>What’s debated</div>
        <div class="items">
          ${debate.map((e) => `<div class="item"><div class="mark">?</div><div><strong>${e.text}</strong></div></div>`).join("")}
        </div>
      `;

      const foot = document.getElementById("foot");
      const count = (story.articles || []).length || (story.sources || []).reduce((a, s) => a + (s.count || 0), 0) || 0;
      foot.innerHTML = `
        <span>Sources: ${count} assessed</span>
        <span>Tap “Read” to verify.</span>
      `;

      const orig = document.getElementById("orig");
      orig.innerHTML = (story.articles || [])
        .map(
          (a) => `
            <div class="link">
              <div>
                <strong>${a.source.toUpperCase()} — ${a.headline}</strong>
                <span>${a.url}</span>
              </div>
              <a class="read" href="${a.url}" target="_blank" rel="noreferrer">Read</a>
            </div>
          `
        )
        .join("");
    </script>
  </body>
</html>
