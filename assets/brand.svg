    <rect x="94" y="30" width="12" height="30" rx="6" transform="rotate(5 100 45)"/>
    <rect x="108" y="42" width="12" height="26" rx="6" transform="rotate(25 114 55)"/>
    <circle cx="112" cy="24" r="6"/>
  </g>
</svg>
