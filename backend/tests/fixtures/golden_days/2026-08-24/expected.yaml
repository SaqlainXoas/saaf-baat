# What the brief for 2026-08-24 should have contained.
#
# DRAFTED BY CLAUDE from the captured headline list. Recall measured against it
# therefore means "found everything Claude guessed mattered" — read the number
# with that in mind.
#
# NOT regenerated by `scripts/derive_expectations.py`, deliberately. This day
# was captured at 15 articles per source (120 total) where production ingests
# roughly 40 (~300), and cross-publisher corroboration is meaningless in a pool
# that thin: the oracle finds only 3 corroborated stories here against 9 on the
# 2026-08-25 fixture, which was recaptured at 40. Replacing seven hand-written
# expectations with three derived from an unrepresentative pool would lower the
# bar, not raise it. Three of the seven below (ajk-reserved-seats,
# asif-video-fake, centre-sindh-tolerance) are independently confirmed by the
# oracle; the other four rest on judgement alone.
#
# 2026-08-25 is the representative day. Treat this one as the older, thinner
# fixture it is, and re-capture it at 40/source if it is ever worth the quota.
#
# This file is the human half of the ship criteria. It is not generated from
# pipeline output, and it must not be edited to make a failing run pass.
day: "2026-08-24"

# Endpoints the health gate must still catch when this day is replayed.
expected_quarantine:
  - "tribune:sitemap:no-dates"

# Stories a Pakistani reader would expect in that morning's brief. Each is
# carried by several outlets in the captured pool, so a selector working on
# this day's articles could reach all of them. A story counts as covered when
# `min_keyword_hits` of its keywords appear in a card's headline or summary.
must_have:
  - id: munir-iran-visit
    description: >-
      CDF Asim Munir and Mohsin Naqvi travel to Tehran as Pakistan pushes
      regional peace, with US sanctions on Iran looming.
      Carried by dawn, brecorder, geo, ary, tribune.
    keywords: ["munir", "iran", "tehran", "naqvi"]
    min_keyword_hits: 2

  - id: ajk-reserved-seats
    description: >-
      PML-N takes 5 of 7 reserved seats in the AJK Legislative Assembly and is
      set to form the government. Carried by dawn, ary, geo, tribune.
    keywords: ["ajk", "reserved seats", "pml-n", "assembly"]
    min_keyword_hits: 2

  - id: centre-sindh-tolerance
    description: >-
      PM Shehbaz and the Sindh CM agree to maintain political tolerance and
      consultation amid the federal-provincial rift. Carried by app, brecorder, dawn.
    keywords: ["shehbaz", "sindh", "political", "tolerance", "consultation"]
    min_keyword_hits: 2

  - id: mir-raza-jit
    description: >-
      Mir Raza Ali's family petitions the Sindh High Court for a JIT and
      opposes a judicial commission. Carried by brecorder, geo, ary, nation.
    keywords: ["mir raza", "jit", "shc", "sindh high court"]
    min_keyword_hits: 2

  - id: asif-video-fake
    description: >-
      The information ministry says the viral video of Khawaja Asif comparing
      Pakistan's progress with India's is AI-generated.
      Carried by dawn, geo, tribune.
    keywords: ["asif", "video", "fake", "ai-generated", "information ministry"]
    min_keyword_hits: 2

  - id: keti-bandar-port
    description: >-
      Keti Bandar Port phase one costed at $522m; a Chinese company meets
      President Zardari. Carried by app, brecorder, tribune.
    keywords: ["keti", "port", "zardari", "522"]
    min_keyword_hits: 2

  - id: punjab-schools-reopen
    description: >-
      Punjab schools reopen after the summer break — a direct daily-life story
      for millions of households. Carried by ary, nation.
    keywords: ["schools", "reopen", "punjab", "summer"]
    min_keyword_hits: 2

# Things the brief must never contain. Every one of these was in the captured
# pool, so their absence is a real result, not a tautology.
must_not_have:
  - id: royal-celebrity-gossip
    description: Royal-family and celebrity churn from thenews/geo entertainment feeds.
    keywords: ["prince harry", "princess kate", "prince william", "hayden panettiere", "bret michaels"]
    min_keyword_hits: 1

  - id: foreign-sport
    description: ATP Cincinnati, Premier League, cricket scorecards.
    keywords: ["atp masters", "cincinnati", "premier league", "barcelona", "gauff"]
    min_keyword_hits: 1

  - id: foreign-entertainment
    description: Box office, GTA 6 leaks, Hollywood disputes.
    keywords: ["spider-man", "box office", "gta 6", "mark ruffalo", "yellowstone"]
    min_keyword_hits: 1

  - id: advertorial
    description: Corporate anniversary and MoU-signing puffery.
    keywords: ["50 years of partnership", "signs mou", "smart city"]
    min_keyword_hits: 1

  - id: opinion-column
    description: Opinion and religious-reflection columns, not news.
    keywords: ["farewell sermon", "timeless message", "taught pakistan"]
    min_keyword_hits: 1

# A sanity band, not the product spec. Tightened to the shipped 10-12 target
# when R-5 landed, as the earlier note here asked. The floor is a guard against
# a collapse, not a quota: the editor is explicitly allowed to return fewer
# than 12 rather than pad, and a run that trips this floor wants reading, not
# a lowered number.
brief_size:
  min: 6
  max: 12

# Recorded from the first run so the harness ratchets rather than failing on
# day one. Raise it as selection improves; never lower it to make a run pass.
#
# 2026-08-24, R-3 + R-4: 0.857 -> 1.000. Triage replaced keyword classification,
# and the publish-score tower was replaced by facts ordered lexicographically.
# The last miss (punjab-schools-reopen) came back once local Pakistani stories
# were ranked above foreign ones claiming a knock-on effect.
baseline_recall: 1.0   # 7 of 7 toplines (deterministic selection, editorial LLM off)

# Articles the grouper merged into a cluster holding more than one event, as
# measured by `measure_cluster_quality`. A merged article is a story the editor
# never sees as a candidate: one live cluster held four unrelated events under
# the headline of the smallest of them. Recorded from the run that first scored
# this day. Lower it as grouping improves; never raise it to make a run pass.
max_merged_articles: 3
