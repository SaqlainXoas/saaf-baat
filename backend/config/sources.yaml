sources:
  dawn:
    url: "https://www.dawn.com"
    feed_url: "https://www.dawn.com/feeds/latest-news"
    sections:
      - "latest-news"
      - "pakistan"
      - "business"
    enabled: true

  tribune:
    url: "https://tribune.com.pk"
    feed_url: "https://tribune.com.pk/rss.xml"
    sections:
      - "latest"
      - "pakistan"
      - "business"
    enabled: true

  geo:
    url: "https://www.geo.tv"
    feed_url: "https://www.geo.tv/rss"
    sections:
      - "latest-news"
      - "pakistan"
    enabled: true

  ary:
    url: "https://arynews.tv"
    # ARY is a Next.js site — /feed/ returns HTML, not RSS.
    # FeedDiscoverer will fall back to section-page scraping.
    sections:
      - "latest-news"
      - "pakistan"
    enabled: true

  samaa:
    url: "https://www.samaa.tv"
    feed_url: "https://www.samaa.tv/rss/1"
    sections:
      - "latest"
      - "pakistan"
    # All RSS endpoints blocked — re-enable once a working feed URL is found.
    enabled: false

  thenews:
    url: "https://www.thenews.com.pk"
    feed_url: "https://www.thenews.com.pk/rss/1/1"
    sections:
      - "latest"
      - "pakistan"
    enabled: true

scraping_config:
  max_articles_per_source: 20
