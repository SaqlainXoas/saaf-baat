sources:
  dawn:
    url: "https://www.dawn.com"
    sections:
      - "https://www.dawn.com/pakistan"
      - "https://www.dawn.com/business"
    enabled: true

  tribune:
    url: "https://tribune.com.pk"
    sections:
      - "https://tribune.com.pk/pakistan"
      - "https://tribune.com.pk/business"
    enabled: true

  geo:
    url: "https://www.geo.tv"
    sections:
      - "https://www.geo.tv/category/pakistan"
      - "https://www.geo.tv/category/business"
    enabled: true

  ary:
    url: "https://arynews.tv"
    # ARY is not reliable enough for core-source use right now.
    # Live checks on 2026-04-02 showed:
    # - section discovery either returned no story links or failed outright
    # - direct article scraping also failed, including Playwright fallback
    # Re-enable only after a stable discovery path and extractor are verified.
    sections:
      - "latest-news"
      - "category/pakistan"
    enabled: false

  samaa:
    url: "https://www.samaa.tv"
    feed_url: "https://www.samaa.tv/rss/1"
    sections:
      - "latest"
      - "pakistan"
    # All RSS endpoints blocked — re-enable once a working feed URL is found.
    enabled: false

  thenews:
    url: "https://www.thenews.com.pk"
    feed_url: "https://www.thenews.com.pk/rss/1/1"
    sections:
      - "pakistan"
    # Re-enable once section-scoped discovery is verified. The current RSS is too broad.
    enabled: false

scraping_config:
  max_articles_per_source: 20
